<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match the Words</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Serif+Japanese:wght@400;700&family=Noto+Serif+Korean:wght@400;700&family=Noto+Serif+Hong+Kong:wght@400;700&family=Noto+Serif+Traditional+Chinese:wght@400;700&family=Noto+Serif+Thai:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Serif+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        /* 语言特定字体 */
        .font-japanese {
            font-family: 'Noto Serif Japanese', serif;
        }
        
        .font-korean {
            font-family: 'Noto Serif Korean', serif;
        }
        
        .font-hongkong {
            /* font-family: 'Noto Serif Hong Kong', serif; */
            font-family: 'Noto Serif', serif;
        }
        
        .font-minnan {
            font-family: 'Noto Serif', serif;
            /* font-family: 'Noto Serif Traditional Chinese', serif; */
        }
        
        .font-thai {
            font-family: 'Noto Serif Thai', serif;
        }
        
        .font-arabic {
            font-family: 'Noto Naskh Arabic', serif;
        }

        .font-hindi {
            font-family: 'Noto Serif Devanagari', serif;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 1200px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            align-items: start;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .language-info {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 1.3em;
            font-weight: 500;
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .error-panel {
            background: #fff3e0;
            border-radius: 10px;
            padding: 20px;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .error-panel h3 {
            color: #e65100;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-bottom: 2px solid #ffb74d;
            padding-bottom: 10px;
        }

        .error-panel-item {
            padding: 10px;
            margin: 8px 0;
            background: white;
            border-left: 4px solid #f44336;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .error-panel-word {
            font-weight: bold;
            color: #f44336;
            margin-bottom: 4px;
        }

        .error-panel-language {
            color: #666;
            font-size: 0.85em;
            margin-bottom: 4px;
        }

        .error-panel-count {
            color: #666;
            font-size: 0.85em;
        }

        .error-panel-empty {
            color: #4caf50;
            text-align: center;
            padding: 20px;
            font-weight: bold;
        }

        .pagination-btn {
            padding: 8px 16px;
            margin: 0 5px;
            border: 1px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s ease;
        }

        .pagination-btn:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }

        .pagination-btn.active {
            background: #667eea;
            color: white;
            font-weight: bold;
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-info {
            display: inline-block;
            margin: 0 10px;
            color: #666;
            font-size: 0.9em;
        }

        .word-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #englishColumn,
        #translationColumn {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .column-title {
            text-align: center;
            font-weight: bold;
            color: #667eea;
            font-size: 1.3em;
            padding: 12px;
            background: #f0f0f0;
            border-radius: 10px;
            height: 50px; /* 固定高度 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .word-card {
            position: relative;
            padding: 15px 20px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 1.3em;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60px; /* 固定高度，确保所有卡片高度一致 */
        }

        .word-card.large-font {
            font-size: 1.95em; /* 1.3 * 1.5 = 1.95 */
        }

        .word-card:hover:not(.matched):not(.selected) {
            background: #e8eaf6;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .word-card.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: scale(1.05);
        }

        .word-card.matched {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
            cursor: default;
        }

        .word-card.error {
            background: #f44336;
            color: white;
            border-color: #f44336;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
            align-items: center;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            min-width: 200px;
        }

        .btn-next {
            background: #667eea;
            color: white;
        }

        .btn-next:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }


        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.3em;
                margin-bottom: 15px;
            }

            .language-info {
                font-size: 1em;
                margin-bottom: 15px;
            }

            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .error-panel {
                position: static;
                max-height: none;
            }

            .game-area {
                grid-template-columns: 1fr 1fr; /* 保持两列布局 */
                gap: 8px; /* 缩小间距 */
            }

            .column-title {
                font-size: 1em;
                padding: 8px;
                height: 40px; /* 移动端固定高度 */
            }

            .word-card {
                padding: 8px 10px; /* 缩小内边距 */
                font-size: 0.95em; /* 缩小字体 */
                height: 50px; /* 移动端固定高度 */
            }
            
            .word-card.large-font {
                font-size: 1.43em; /* 0.95 * 1.5 = 1.425 */
            }

            .controls {
                flex-direction: column;
                gap: 15px;
                margin-top: 20px;
            }

            .btn {
                width: 100%;
                padding: 12px 30px;
                font-size: 1.1em;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        /* 自定义 tooltip 样式 - 立即显示，无动画 */
        .transcription-tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 8px;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            border-radius: 4px;
            font-size: 0.9em;
            white-space: nowrap;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: none; /* 无动画 */
        }

        .word-card:hover .transcription-tooltip {
            opacity: 1;
            visibility: visible;
        }

        .transcription-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: rgba(0, 0, 0, 0.85);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="mainTitle">Match the Words</h1>
        <div class="language-info" id="languageInfo"></div>
        <div id="loading" class="loading">Loading...</div>
        <div id="gameContent" style="display: none;">
            <div class="main-content">
                <div>
                    <div class="game-area" id="gameArea"></div>
                    <div class="controls" id="controls">
                        <button class="btn btn-next" onclick="nextRound()">Next</button>
                    </div>
                </div>
                <div class="error-panel">
                    <h3>Mistakes</h3>
                    <div id="errorPanelContent"></div>
                    <div id="errorPagination" style="display: none; margin-top: 15px; text-align: center;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allWordsData = []; // 存储所有语言的数据
        let availableLanguages = []; // 可用语言列表
        let currentLanguageIndex = -1; // 当前语言索引
        let selectedLanguage = '';
        let currentWords = [];
        let selectedCards = [];
        let matchedPairs = [];
        let errorStats = {}; // {word: {english: '', translation: '', language: '', count: 0}}
        let currentErrorPage = 1;
        const errorsPerPage = 5;
        
        // 需要大字体的语言
        const largeFontLanguages = ['العربية', 'ภาษาไทย', 'ئۇيغۇرچە', 'हिन्दी'];
        
        // 带种子的随机数生成器（使用 timestamp 作为种子）
        let seed = Date.now();
        function seededRandom() {
            seed = (seed * 9301 + 49297) % 233280;
            return seed / 233280;
        }
        
        // 更新标题显示语言数量
        function updateTitle() {
            const title = document.getElementById('mainTitle');
            const languageCount = availableLanguages.length;
            title.textContent = `Match the Words in ${languageCount} Languages`;
        }
        
        // 获取语言的字体类
        function getLanguageFontClass(language) {
            const fontMap = {
                '日本語': 'font-japanese',
                '한국어': 'font-korean',
                '粤语': 'font-hongkong',
                '闽南语': 'font-minnan',
                'ภาษาไทย': 'font-thai',
                'العربية': 'font-arabic',
                'ئۇيغۇرچە': 'font-arabic',
                'हिन्दी': 'font-hindi'
            };
            return fontMap[language] || '';
        }

        // 加载TSV文件
        async function loadWords() {
            try {
                const response = await fetch('lang.tsv');
                const text = await response.text();
                const lines = text.trim().split('\n');
                
                // 解析表头
                const headers = lines[0].split('\t');
                const englishIndex = headers.indexOf('English');
                
                // 获取所有非英语、非汉语的语言，排除带有 [T] 标记的读音转写列
                headers.forEach((lang, index) => {
                    if (index !== englishIndex && lang !== '汉语' && lang.trim() !== '' && !lang.includes('[T]')) {
                        availableLanguages.push({name: lang, index: index});
                    }
                });
                
                // 存储所有数据
                allWordsData = {
                    headers: headers,
                    lines: lines,
                    englishIndex: englishIndex
                };
                
                // 更新标题显示语言数量
                updateTitle();
                
                // 选择第一个语言并开始游戏
                selectNextLanguage();
                loadWordsForLanguage();
                
            } catch (error) {
                console.error('加载文件失败:', error);
                document.getElementById('loading').textContent = '加载失败，请检查文件是否存在';
            }
        }
        
        // 选择下一个语言（随机选择）
        function selectNextLanguage() {
            // 更新种子为当前时间戳
            seed = Date.now();
            // 随机选择一个语言索引
            currentLanguageIndex = Math.floor(seededRandom() * availableLanguages.length);
            selectedLanguage = availableLanguages[currentLanguageIndex].name;
        }
        
        // 加载当前语言的单词
        function loadWordsForLanguage() {
            const lang = availableLanguages[currentLanguageIndex];
            const words = [];
            
            // 查找对应的读音转写列（如果有）
            const transcriptionIndex = allWordsData.headers.findIndex(h => h === `${lang.name}[T]`);
            
            for (let i = 1; i < allWordsData.lines.length; i++) {
                const columns = allWordsData.lines[i].split('\t');
                const english = columns[allWordsData.englishIndex];
                const translation = columns[lang.index];
                
                if (english && translation && english.trim() !== '' && translation.trim() !== '') {
                    const word = {
                        english: english.trim(),
                        translation: translation.trim()
                    };
                    
                    // 如果有读音转写列，添加读音转写信息
                    if (transcriptionIndex !== -1 && columns[transcriptionIndex]) {
                        word.transcription = columns[transcriptionIndex].trim();
                    }
                    
                    words.push(word);
                }
            }
            
            currentWords = words;
            const languageInfo = document.getElementById('languageInfo');
            const fontClass = getLanguageFontClass(selectedLanguage);
            languageInfo.className = fontClass ? `language-info ${fontClass}` : 'language-info';
            languageInfo.textContent = `English ↔ ${selectedLanguage}`;
            
            startNewGame();
        }

        // 开始新游戏
        function startNewGame() {
            // 更新种子为当前时间戳
            seed = Date.now();
            // 随机选择10个单词
            const shuffled = [...currentWords].sort(() => seededRandom() - 0.5);
            const selectedWords = shuffled.slice(0, 10);
            
            console.log('🎮 开始新游戏:', {
                language: selectedLanguage,
                wordCount: selectedWords.length,
                sampleWord: selectedWords[0]
            });
            
            // 创建单词对并打乱
            const wordPairs = [];
            selectedWords.forEach(word => {
                wordPairs.push({text: word.english.trim(), type: 'english', pair: word.translation.trim(), original: word});
                wordPairs.push({text: word.translation.trim(), type: 'translation', pair: word.english.trim(), original: word});
            });
            
            // 打乱顺序
            wordPairs.sort(() => seededRandom() - 0.5);
            
            // 分离英语和翻译
            const englishWords = wordPairs.filter(w => w.type === 'english');
            const translationWords = wordPairs.filter(w => w.type === 'translation');
            
            // 渲染游戏区域
            renderGame(englishWords, translationWords);
            
            selectedCards = [];
            matchedPairs = [];
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('gameContent').style.display = 'block';
            
            // 初始化错误面板
            currentErrorPage = 1;
            updateErrorPanel();
        }

        // 渲染游戏
        function renderGame(englishWords, translationWords) {
            const gameArea = document.getElementById('gameArea');
            const fontClass = getLanguageFontClass(selectedLanguage);
            
            gameArea.innerHTML = `
                <div class="word-column">
                    <div class="column-title">English</div>
                    <div id="englishColumn"></div>
                </div>
                <div class="word-column">
                    <div class="column-title ${fontClass}">${selectedLanguage}</div>
                    <div id="translationColumn" class="${fontClass}"></div>
                </div>
            `;
            
            const englishColumn = document.getElementById('englishColumn');
            const translationColumn = document.getElementById('translationColumn');
            
            englishWords.forEach((word, index) => {
                const card = createCard(word, index, 'english');
                englishColumn.appendChild(card);
            });
            
            translationWords.forEach((word, index) => {
                const card = createCard(word, index, 'translation');
                translationColumn.appendChild(card);
            });
        }

        // 创建卡片
        function createCard(word, index, type) {
            const card = document.createElement('div');
            card.className = 'word-card';
            
            // 如果是翻译列，应用语言字体类
            if (type === 'translation') {
                const fontClass = getLanguageFontClass(selectedLanguage);
                if (fontClass) {
                    card.classList.add(fontClass);
                }
                // 如果语言需要大字体，添加large-font类
                if (largeFontLanguages.includes(selectedLanguage)) {
                    card.classList.add('large-font');
                }
                
            }
            
            // 确保文本被 trim，去除可能的空格
            const trimmedText = word.text.trim();
            
            // 创建一个 span 来存放主要文本（避免 tooltip 影响 textContent）
            const textSpan = document.createElement('span');
            textSpan.textContent = trimmedText;
            card.appendChild(textSpan);
            
            // 如果有读音转写，添加自定义 tooltip
            if (type === 'translation' && word.original && word.original.transcription) {
                const tooltip = document.createElement('div');
                tooltip.className = 'transcription-tooltip';
                tooltip.textContent = word.original.transcription.trim();
                card.appendChild(tooltip);
            }
            
            // 存储实际的文本值在 dataset 中，用于匹配检查
            card.dataset.text = trimmedText;
            card.dataset.index = index;
            card.dataset.type = type;
            card.dataset.pair = word.pair.trim(); // 确保 pair 也被 trim
            card.dataset.originalEnglish = word.original.english.trim();
            card.dataset.originalTranslation = word.original.translation.trim();
            
            card.addEventListener('click', () => handleCardClick(card, word));
            
            return card;
        }

        // 处理卡片点击
        function handleCardClick(card, word) {
            // 如果已经匹配，不能点击
            if (card.classList.contains('matched')) {
                return;
            }
            
            // 如果已经选中，取消选中
            if (card.classList.contains('selected')) {
                card.classList.remove('selected');
                selectedCards = selectedCards.filter(c => c !== card);
                return;
            }
            
            // 如果同一列已经有选中的，先取消
            const column = card.dataset.type;
            selectedCards.forEach(selectedCard => {
                if (selectedCard.dataset.type === column) {
                    selectedCard.classList.remove('selected');
                }
            });
            selectedCards = selectedCards.filter(c => c.dataset.type !== column);
            
            // 选中当前卡片
            card.classList.add('selected');
            selectedCards.push(card);
            
            // 检查是否匹配
            if (selectedCards.length === 2) {
                checkMatch();
            }
        }

        // 检查匹配
        function checkMatch() {
            const [card1, card2] = selectedCards;
            
            // 确保一个是英语，一个是翻译
            if (card1.dataset.type === card2.dataset.type) {
                selectedCards.forEach(card => card.classList.remove('selected'));
                selectedCards = [];
                return;
            }
            
            const englishCard = card1.dataset.type === 'english' ? card1 : card2;
            const translationCard = card1.dataset.type === 'translation' ? card1 : card2;
            
            // 使用 dataset.text 而不是 textContent，因为 textContent 会包含 tooltip 的内容
            const englishPair = englishCard.dataset.pair;
            const translationText = translationCard.dataset.text;
            const translationPair = translationCard.dataset.pair;
            const englishText = englishCard.dataset.text;
            
            console.log('🔍 匹配检查:', {
                language: selectedLanguage,
                english: englishText,
                translation: translationText,
                englishPair: englishPair,
                translationPair: translationPair,
                englishMatch: englishPair === translationText,
                translationMatch: translationPair === englishText
            });
            
            if (englishPair === translationText && translationPair === englishText) {
                // 匹配成功
                console.log('✅ 匹配成功!');
                englishCard.classList.remove('selected');
                translationCard.classList.remove('selected');
                englishCard.classList.add('matched');
                translationCard.classList.add('matched');
                
                // 记录匹配
                matchedPairs.push({
                    english: englishText,
                    translation: translationText
                });
                
                selectedCards = [];
                
                // 检查是否全部完成
                checkGameComplete();
            } else {
                // 匹配失败
                console.log('❌ 匹配失败!', {
                    reason: '不匹配',
                    englishPairBytes: [...englishPair].map(c => c.charCodeAt(0)),
                    translationTextBytes: [...translationText].map(c => c.charCodeAt(0)),
                    translationPairBytes: [...translationPair].map(c => c.charCodeAt(0)),
                    englishTextBytes: [...englishText].map(c => c.charCodeAt(0))
                });
                
                englishCard.classList.add('error');
                translationCard.classList.add('error');
                
                // 记录错误（使用 语言+英文单词 作为唯一键，以区分同一单词在不同语言中的错误）
                const english = englishCard.dataset.originalEnglish;
                const translation = englishCard.dataset.originalTranslation;
                const errorKey = `${selectedLanguage}|${english}`;
                
                if (!errorStats[errorKey]) {
                    errorStats[errorKey] = {
                        english: english,
                        translation: translation,
                        language: selectedLanguage,
                        count: 0,
                        lastAdded: 0
                    };
                }
                errorStats[errorKey].count++;
                errorStats[errorKey].lastAdded = Date.now();
                
                // 更新错误面板
                updateErrorPanel();
                
                // 移除错误样式和选中状态
                setTimeout(() => {
                    englishCard.classList.remove('error', 'selected');
                    translationCard.classList.remove('error', 'selected');
                    selectedCards = [];
                }, 1000);
            }
        }

        // 更新错误面板
        function updateErrorPanel() {
            const errorPanelContent = document.getElementById('errorPanelContent');
            const errorPagination = document.getElementById('errorPagination');
            const errorWords = Object.values(errorStats).filter(stat => stat.count > 0);
            
            if (errorWords.length === 0) {
                errorPanelContent.innerHTML = '<div class="error-panel-empty">No errors</div>';
                errorPagination.style.display = 'none';
            } else {
                // 按最后加入时间排序，新加入的放在最前面
                errorWords.sort((a, b) => (b.lastAdded || 0) - (a.lastAdded || 0));
                
                // 计算分页
                const totalPages = Math.ceil(errorWords.length / errorsPerPage);
                const startIndex = (currentErrorPage - 1) * errorsPerPage;
                const endIndex = startIndex + errorsPerPage;
                const pageErrors = errorWords.slice(startIndex, endIndex);
                
                // 显示当前页的错误
                errorPanelContent.innerHTML = pageErrors.map(stat => `
                    <div class="error-panel-item">
                        <div class="error-panel-word">${stat.english} - ${stat.translation}</div>
                        <div class="error-panel-language">Language: ${stat.language}</div>
                        <div class="error-panel-count">Errors: ${stat.count}</div>
                    </div>
                `).join('');
                
                // 显示分页控件（只有超过一页时才显示）
                if (totalPages > 1) {
                    errorPagination.style.display = 'block';
                    errorPagination.innerHTML = `
                        <button class="pagination-btn" onclick="changeErrorPage(${currentErrorPage - 1})" ${currentErrorPage === 1 ? 'disabled' : ''}>Prev</button>
                        <span class="pagination-info">Page ${currentErrorPage} of ${totalPages}</span>
                        <button class="pagination-btn" onclick="changeErrorPage(${currentErrorPage + 1})" ${currentErrorPage === totalPages ? 'disabled' : ''}>Next</button>
                    `;
                } else {
                    errorPagination.style.display = 'none';
                }
            }
        }
        
        // 切换错误面板页码
        function changeErrorPage(page) {
            const errorWords = Object.values(errorStats).filter(stat => stat.count > 0);
            const totalPages = Math.ceil(errorWords.length / errorsPerPage);
            
            if (page >= 1 && page <= totalPages) {
                currentErrorPage = page;
                updateErrorPanel();
            }
        }

        // 检查游戏是否完成
        function checkGameComplete() {
            // Next 按钮始终显示，不需要特殊处理
        }

        // 下一轮
        function nextRound() {
            // 切换到下一个语言
            selectNextLanguage();
            loadWordsForLanguage();
        }


        // 页面加载时初始化
        window.addEventListener('load', () => {
            loadWords();
        });
    </script>
</body>
</html>
